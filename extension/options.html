<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>DLsite Coupon Plus</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #12121f;
    --panel: #1a1a2e;
    --border: #383860;
    --text: #e6e6f0;
    --dim: #8b8bb0;
    --accent: #ffd166;
    --good: #4fd1c5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 20px 60px;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
      "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 16px; margin: 0 0 4px; letter-spacing: 0.02em; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 20px; }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  h2 { font-size: 13px; margin: 0 0 10px; color: #fff; font-weight: 700; }
  label.field { display: block; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  select, button {
    font: inherit;
    color: var(--text);
    background: #24243d;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 9px;
    cursor: pointer;
  }
  select { min-width: 190px; }
  button:hover { border-color: var(--good); }
  button.danger:hover { border-color: #ff6b8a; color: #ff8fa6; }
  .hint { color: var(--dim); font-size: 11.5px; margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #26264a; }
  th { color: var(--dim); font-weight: 500; white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .acc { color: var(--accent); font-weight: 700; }
  .empty { color: var(--dim); }
  .saved { color: var(--good); font-size: 12px; margin-left: 8px; opacity: 0; transition: opacity .2s; }
  .saved.on { opacity: 1; }
  .work { color: var(--dim); font-size: 11px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">DLsite Coupon Plus</h1>
  <div class="sub" id="subtitle"></div>

  <section>
    <h2 id="tLangMode">表示言語</h2>
    <div class="row">
      <select id="langMode">
        <option value="auto" id="optAuto">DLsite の表示言語に合わせる</option>
        <option value="fixed" id="optFixed">言語を固定する</option>
      </select>
      <select id="langOverride" hidden></select>
    </div>
    <div class="hint" id="langHint"></div>
  </section>

  <section>
    <h2 id="tRecord">価格を記録する</h2>
    <div class="row">
      <label class="row" style="gap:6px;cursor:pointer;">
        <input type="checkbox" id="record">
      </label>
      <span class="saved" id="saved"></span>
    </div>
    <div class="hint" id="recordHint"></div>
  </section>

  <section>
    <h2 id="tRecords">記録した作品</h2>
    <div class="row" style="margin-bottom:10px;">
      <button id="export">JSON</button>
      <button id="clear" class="danger">Clear</button>
      <span class="hint" id="count" style="margin:0;"></span>
    </div>
    <table>
      <thead>
        <tr>
          <th id="cWork">作品</th>
          <th id="cPlain" class="num"></th>
          <th id="cCoupon" class="num"></th>
          <th id="cTheory" class="num"></th>
          <th id="cSamples" class="num"></th>
          <th id="cUpdated"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</div>
<script src="lib/i18n.js"></script>
<script src="lib/history.js"></script>
<script src="options.js"></script>
</body>
</html>
