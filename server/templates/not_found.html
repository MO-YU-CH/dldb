{% extends "base.html" %}
{% block title %}{{ T('not_found_title') }} — {{ site_name }}{% endblock %}

{% block content %}
<section class="hero small">
  <h1>{{ T('not_found_title') }}</h1>
  {% if workno %}<p class="mono">{{ workno }}</p>{% endif %}

</section>
{% endblock %}
